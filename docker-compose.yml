# ==============================================================================
# Docker Compose for Vishwakarma Bat House (Local & Staging Testing)
# ==============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vkbathouse_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.ivrxmhfumjidwgbnwynz:vkbatisstrong18@aws-0-ap-south-1.pooler.supabase.com:6543/postgres}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-vk_bathouse_super_secret_jwt_key_development_change_in_production_9837429873498}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
      - GST_PERCENTAGE=0.0
      - DEFAULT_SHIPPING_FEE=0.0
      - FREE_SHIPPING_THRESHOLD=0.0
      - WHATSAPP_NUMBER=919274543199
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  backend_uploads:
    name: vkbathouse_uploads
